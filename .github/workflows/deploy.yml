# cicd.yml
name: Deploy PHP App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Copy project to EC2 (SCP)
        run: |
          scp -i ~/.ssh/id_rsa -r ./ $EC2_USER@$EC2_HOST:/home/$EC2_USER/var/www/html/
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Installation des dépendances et configuration du serveur
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            set -e
            
            cd /home/$EC2_USER/var/www/html/

            # Mise à jour et installation de Nginx, PHP et MariaDB
            sudo apt update
            sudo apt install -y nginx php-fpm php-mysql

            # Détection automatique de la version PHP installée
            PHP_VERSION=$(php -r "echo PHP_MAJOR_VERSION.'.'.PHP_MINOR_VERSION;")
            PHP_FPM_SOCK="unix:/var/run/php/php${PHP_VERSION}-fpm.sock"

            # Configuration de Nginx
            sudo tee /etc/nginx/sites-available/default > /dev/null << EOL
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /home/$EC2_USER/var/www/html;
    index index.php index.html index.htm;

    server_name _;

    location / {
        try_files \$uri \$uri/ =404;
    }

    location ~ \.php\$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass $PHP_FPM_SOCK;
    }

    location ~ /\.ht {
        deny all;
    }
}
EOL

            # Redémarrage et activation des services
            sudo systemctl restart nginx
            sudo systemctl restart php${PHP_VERSION}-fpm
            sudo systemctl enable nginx
            sudo systemctl enable php${PHP_VERSION}-fpm

            # Correction des permissions
            sudo chown -R www-data:www-data /home/$EC2_USER/var/www/html/
            sudo chmod -R 755 /home/$EC2_USER/var/www/html/
          EOF
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

